*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1040px;margin:auto;padding:18px 14px 80px}.hero{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:4px 0 14px}.hero h1{font-size:clamp(22px,5vw,34px);margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:14px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;min-height:44px;color:var(--text)}.btn:hover{border-color:#bbb}.btn.primary{background:var(--green2);border-color:var(--green2);color:#fff}.btn.danger{color:#9a4242}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px;margin-top:3px}.stat span{font-size:12px;color:var(--muted)}.progress-wrap{grid-column:1/-1;background:#e5e4dd;border-radius:999px;height:10px;overflow:hidden}.progress-bar{height:100%;background:var(--green2);width:0;transition:width .2s}.toolbar{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 92%, transparent);backdrop-filter:blur(9px);padding:10px 0 8px}.search-row{display:grid;grid-template-columns:1fr 170px 190px;gap:8px}.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px 12px;color:var(--text)}.filter-chips{display:flex;gap:7px;overflow:auto;padding:8px 0 2px;scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:8px 11px;border-radius:999px;min-height:38px}.chip.active{background:var(--green3);border-color:var(--green3);color:white}.summaryline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin:8px 2px}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--gray);border-radius:13px;min-height:64px;padding:8px 8px 8px 12px;transition:.12s}.item.obtained{background:var(--green);border-color:#c2d4bd}.item:hover{transform:translateY(-1px)}.no{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}.name{font-weight:700;line-height:1.35}.unknown .name{color:#8a8f87}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.tag{font-size:11px;border:1px solid #d1d1ca;background:rgba(255,255,255,.55);border-radius:999px;padding:3px 7px;color:#62675f}.tag.machine{background:#e6ece3;border-color:#c8d3c2;color:#4f6250;font-weight:700}.status-btn{min-width:112px;min-height:46px;border:none;border-radius:10px;background:#deded8;color:#50544d;font-weight:700}.obtained .status-btn{background:var(--green2);color:white}.empty{padding:50px 10px;text-align:center;color:var(--muted)}.modal{border:none;border-radius:18px;padding:0;width:min(760px,calc(100% - 22px));max-height:90%;box-shadow:0 25px 70px rgba(0,0,0,.25);background:var(--panel);color:var(--text)}.modal::backdrop{background:rgba(20,25,18,.45);backdrop-filter:blur(2px)}.modal-head{position:sticky;top:0;background:var(--panel);z-index:2;padding:18px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:transparent;font-size:24px;padding:4px 9px}.modal-body{padding:16px 18px 22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.label{display:grid;gap:6px;font-size:13px;color:var(--muted)}textarea.field{min-height:90px;resize:vertical}.section{margin-top:20px;padding-top:15px;border-top:1px dashed var(--line)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.section-title h3{margin:0;font-size:16px}.relation-list{display:grid;gap:8px}.relation{display:grid;grid-template-columns:1fr 90px 44px;gap:7px;align-items:center}.machine-rel{grid-template-columns:1fr 44px}.mini{min-height:40px;padding:7px 9px}.remove{border:1px solid #e1c8c8;background:#fff6f6;border-radius:9px;min-height:40px}.modal-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px}.left-actions,.right-actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted);margin:6px 0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#30352f;color:white;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.file-input{display:none}.kbd{font-family:monospace;background:#ebeae3;border:1px solid #d6d5cd;border-radius:5px;padding:1px 5px}

<body>
<div class="app" id="app">
  <section class="hero">
    <div><h1>🌿 ほの暮らしコンプチェッカー</h1><p>2428個の図鑑を、遊びながら少しずつ育てるチェックリスト。</p></div>
    <div class="backup-actions">
      <button class="btn" id="exportJson">JSONバックアップ</button>
      <label class="btn" for="importJson">JSON復元</label><input class="file-input" id="importJson" type="file" accept="application/json,.json">
      <button class="btn" id="exportCsv">CSV書き出し</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><span>取得済み</span><b id="obtainedCount">0</b></div>
    <div class="stat"><span>全アイテム</span><b>2,428</b></div>
    <div class="stat"><span>完成率</span><b id="rate">0.0%</b></div>
    <div class="stat"><span>未取得</span><b id="remaining">2,428</b></div>
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
  </section>

  <section class="toolbar">
    <div class="search-row">
      <input id="search" class="field search" placeholder="🔎 アイテム名・図鑑番号で検索" autocomplete="off">
      <select id="category" class="field"><option value="">すべてのカテゴリ</option></select>
      <select id="sort" class="field"><option value="id">図鑑番号順</option><option value="name">名前順</option><option value="updated">最近編集した順</option></select>
    </div>
    <div class="filter-chips" id="chips">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="missing">未取得</button>
      <button class="chip" data-filter="obtained">取得済</button>
      <button class="chip" data-filter="unknown">情報未登録</button>
    </div>
  </section>
  <div class="summaryline"><span id="shownCount"></span><span>行を押すと取得状態を切替 ／「編集」で情報登録</span></div>
  <main class="items" id="items"></main>
</div>

<dialog class="modal" id="editor">
  <form id="editForm">
    <div class="modal-head"><div><div class="no" id="editNo"></div><h2 id="editTitle">アイテム編集</h2></div><button type="button" class="close" id="closeEditor" aria-label="閉じる">×</button></div>
    <div class="modal-body">
      <div class="grid2">
        <label class="label full">アイテム名<input class="field" id="fName" placeholder="ゲーム内で判明した名前"></label>
        <label class="label">カテゴリ<input class="field" id="fCategory" list="categoryList" placeholder="料理、加工品、家具…"></label>
        <label class="label">売値<input class="field" id="fSell" inputmode="numeric" placeholder="例：460"></label>
        <label class="label full">入手方法・補足<textarea class="field" id="fAcquire" placeholder="入手場所、季節、条件など"></textarea></label>
        <label class="label full">メモ<textarea class="field" id="fNote" placeholder="自由メモ"></textarea></label>
        <label class="label"><span>取得状態</span><select class="field" id="fObtained"><option value="0">未取得</option><option value="1">✓ 取得済</option></select></label>
        <label class="label"><span>調査状況</span><select class="field" id="fResearch"><option value="未特定">未特定</option><option value="確定">確定</option><option value="推定">推定</option><option value="手入力">手入力</option></select></label>
      </div>

      <section class="section">
        <div class="section-title"><h3>🥣 使用材料</h3><button class="btn mini" type="button" id="addMaterial">＋ 材料を追加</button></div>
        <p class="hint">登録済みアイテムは「図鑑番号 | 名前」で選べる。まだ未登録の材料名も直接入力OK。</p>
        <div class="relation-list" id="materials"></div>
      </section>

      <section class="section">
        <div class="section-title"><h3>⚙️ 対応加工機</h3><button class="btn mini" type="button" id="addMachine">＋ 加工機を追加</button></div>
        <div class="relation-list" id="machines"></div>
      </section>

      <div class="modal-actions">
        <div class="left-actions"><button class="btn danger" type="button" id="resetItem">この項目の編集を元に戻す</button></div>
        <div class="right-actions"><button class="btn" type="button" id="cancelEditor">キャンセル</button><button class="btn primary" type="submit">保存</button></div>
      </div>
    </div>
  </form>
</dialog>
<datalist id="itemList"></datalist><datalist id="categoryList"></datalist><datalist id="machineList"></datalist>

<script>
(()=>{
'use strict';
const VERSION='0.2.0';
const KEY='honogurashi-checker-v0.1';
let base=JSON.parse(document.getElementById('base-data').textContent);
let baseMap=new Map(base.map(x=>[x.id,x]));
let state=loadState();
let activeFilter='all', editingId=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const els={items:$('#items'),search:$('#search'),category:$('#category'),sort:$('#sort'),obtainedCount:$('#obtainedCount'),rate:$('#rate'),remaining:$('#remaining'),progress:$('#progress'),shownCount:$('#shownCount'),editor:$('#editor'),form:$('#editForm'),materials:$('#materials'),machines:$('#machines'),toast:$('#toast')};

function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return {version:VERSION,obtained:{},overrides:{}};const s=JSON.parse(raw);return {version:VERSION,obtained:s.obtained||{},overrides:s.overrides||{}}}catch(e){return {version:VERSION,obtained:{},overrides:{}}}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function merged(id){const b=baseMap.get(id)||{id,name:'',category:'',researchStatus:'未特定',acquire:'',sell:'',source:'',note:'',materials:[],machines:[]};const o=state.overrides[id]||{};return {...b,...o,id,materials:o.materials??b.materials??[],machines:o.machines??b.machines??[],updatedAt:o.updatedAt||b.updatedAt||''}}
function isObtained(id){return !!state.obtained[id]}
function manualFlag(item){const o=state.overrides[item.id];return !!o || item.researchStatus==='手入力' || (item.note||'').includes('手入力')}
function pad(id){return String(id).padStart(4,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){els.toast.textContent=msg;els.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>els.toast.classList.remove('show'),1600)}

function parseCsv(text){
 const rows=[];let row=[],cell='',quoted=false;
 text=String(text||'').replace(/^\ufeff/,'');
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=false}else{cell+=c}}
  else if(c==='"'){quoted=true}
  else if(c===','){row.push(cell);cell=''}
  else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
  else{cell+=c}
 }
 if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
 if(!rows.length)return [];
 const headers=rows.shift().map(h=>h.trim());
 return rows.filter(r=>r.some(v=>String(v).trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));
}
function splitRelations(text){return String(text||'').trim()?String(text).split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean):[]}
function relationFromText(text,withQty=false){
 let raw=String(text||'').trim(),quantity=1;
 if(withQty){const q=raw.match(/\s*[×xX]\s*(\d+(?:\.\d+)?)\s*$/);if(q){quantity=Number(q[1]);raw=raw.slice(0,q.index).trim()}}
 const ref=parseRef(raw);const obj={itemId:ref.itemId,name:ref.name};if(withQty)obj.quantity=quantity;return obj;
}
function rowsToBase(rows){
 const mapped=rows.map(r=>{
  const id=Number(String(r['図鑑番号']??r['id']??'').replace(/^#/,'').trim());
  if(!Number.isInteger(id)||id<1||id>2428)return null;
  return {id,name:String(r['アイテム名']??r['name']??'').trim(),category:String(r['カテゴリ']??r['category']??'').trim(),researchStatus:String(r['調査状況']??r['researchStatus']??'未特定').trim()||'未特定',acquire:String(r['入手方法・補足']??r['acquire']??'').trim(),sell:String(r['売値']??r['sell']??'').trim(),source:String(r['出典URL']??r['source']??'').trim(),note:String(r['備考']??r['note']??'').trim(),materials:splitRelations(r['使用材料']).map(x=>relationFromText(x,true)),machines:splitRelations(r['対応加工機']).map(x=>relationFromText(x,false)),updatedAt:String(r['最終更新']??'').trim()};
 }).filter(Boolean);
 const byId=new Map(mapped.map(x=>[x.id,x]));
 return Array.from({length:2428},(_,i)=>byId.get(i+1)||{id:i+1,name:'',category:'',researchStatus:'未特定',acquire:'',sell:'',source:'',note:'',materials:[],machines:[]});
}
async function loadLatestMaster(){
 try{
  const res=await fetch(`initial_item_master.csv?v=${Date.now()}`,{cache:'no-store'});
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const rows=parseCsv(await res.text());
  const latest=rowsToBase(rows);
  if(latest.length!==2428)throw new Error('item count mismatch');
  base=latest;baseMap=new Map(base.map(x=>[x.id,x]));
  return true;
 }catch(err){console.warn('CSV master load failed; embedded fallback is used.',err);return false}
}
function buildLists(){
 const cats=[...new Set(base.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
 els.category.innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
 $('#categoryList').innerHTML=cats.map(c=>`<option value="${esc(c)}"></option>`).join('');
 refreshDatalists();
}
function refreshDatalists(){
 const known=base.map(x=>merged(x.id)).filter(x=>x.name);
 $('#itemList').innerHTML=known.map(x=>`<option value="${pad(x.id)} | ${esc(x.name)}"></option>`).join('');
 const machines=known.filter(x=>/機|道具|器|台|樽/.test((x.category||'')+(x.name||'')));
 $('#machineList').innerHTML=machines.map(x=>`<option value="${pad(x.id)} | ${esc(x.name)}"></option>`).join('');
}
function renderStats(){const n=Object.values(state.obtained).filter(Boolean).length;els.obtainedCount.textContent=n.toLocaleString();els.remaining.textContent=(2428-n).toLocaleString();const r=n/2428*100;els.rate.textContent=r.toFixed(1)+'%';els.progress.style.width=r+'%'}
function filtered(){
 let arr=base.map(x=>merged(x.id)); const q=els.search.value.trim().toLowerCase(); const cat=els.category.value;
 if(q)arr=arr.filter(x=>pad(x.id).includes(q)||String(x.id).includes(q)||(x.name||'').toLowerCase().includes(q));
 if(cat)arr=arr.filter(x=>x.category===cat);
 arr=arr.filter(x=>{const ob=isObtained(x.id), unk=!x.name; if(activeFilter==='missing')return !ob;if(activeFilter==='obtained')return ob;if(activeFilter==='unknown')return unk;return true});
 if(els.sort.value==='name')arr.sort((a,b)=>(a.name||'~~~').localeCompare(b.name||'~~~','ja')||a.id-b.id);
 if(els.sort.value==='updated')arr.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')||a.id-b.id);
 return arr;
}
function render(){renderStats();const arr=filtered();els.shownCount.textContent=`${arr.length.toLocaleString()}件を表示`;
 if(!arr.length){els.items.innerHTML='<div class="empty">条件に合うアイテムがないよ 🌱</div>';return}
 els.items.innerHTML=arr.map(x=>{const ob=isObtained(x.id),unk=!x.name;const machineTags=(x.machines||[]).map(r=>`<span class="tag machine">⚙ ${esc(machineLabel(r))}</span>`).join('');return `<article class="item ${ob?'obtained':''} ${unk?'unknown':''}" data-id="${x.id}"><div class="no">#${pad(x.id)}</div><div><div class="name">${esc(x.name||'未登録アイテム')}</div><div class="meta">${x.category?`<span class="tag">${esc(x.category)}</span>`:''}${machineTags}<button class="tag edit-btn" type="button" data-edit="${x.id}">編集</button></div></div><button class="status-btn" type="button" data-toggle="${x.id}">${ob?'✓ 取得済':'未取得'}</button></article>`}).join('');
}
function toggle(id){state.obtained[id]=!isObtained(id);saveState();render()}

function openEditor(id){editingId=id;const x=merged(id);$('#editNo').textContent='#'+pad(id);$('#editTitle').textContent=x.name||'未登録アイテム';$('#fName').value=x.name||'';$('#fCategory').value=x.category||'';$('#fSell').value=x.sell||'';$('#fAcquire').value=x.acquire||'';$('#fNote').value=x.note||'';$('#fObtained').value=isObtained(id)?'1':'0';$('#fResearch').value=['未特定','確定','推定','手入力'].includes(x.researchStatus)?x.researchStatus:(manualFlag(x)?'手入力':'未特定');
 els.materials.innerHTML='';(x.materials||[]).forEach(addMaterialRow);els.machines.innerHTML='';(x.machines||[]).forEach(addMachineRow);els.editor.showModal();}
function parseRef(v){const m=String(v).match(/^\s*(\d{1,4})\s*\|\s*(.+)$/);if(m){const id=Number(m[1]);return {itemId:baseMap.has(id)?id:null,name:m[2].trim()}}return {itemId:null,name:String(v).trim()}}
function refDisplay(r){if(r.itemId&&baseMap.has(r.itemId)){const x=merged(r.itemId);return `${pad(r.itemId)} | ${x.name||r.name||'未登録アイテム'}`}return r.name||''}
function machineLabel(r){if(r.itemId&&baseMap.has(r.itemId)){const x=merged(r.itemId);return x.name||r.name||'未登録加工機'}return r.name||'未登録加工機'}
function addMaterialRow(data={}){const row=document.createElement('div');row.className='relation';row.innerHTML=`<input class="field mini rel-name" list="itemList" placeholder="材料名" value="${esc(refDisplay(data))}"><input class="field mini rel-qty" type="number" min="0" step="1" inputmode="numeric" placeholder="個数" value="${esc(data.quantity??1)}"><button class="remove" type="button" aria-label="削除">×</button>`;row.querySelector('.remove').addEventListener('click',()=>row.remove());els.materials.appendChild(row)}
function addMachineRow(data={}){const row=document.createElement('div');row.className='relation machine-rel';row.innerHTML=`<input class="field mini rel-name" list="machineList" placeholder="加工機名" value="${esc(refDisplay(data))}"><button class="remove" type="button" aria-label="削除">×</button>`;row.querySelector('.remove').addEventListener('click',()=>row.remove());els.machines.appendChild(row)}
function collectRelations(container,withQty){return [...container.querySelectorAll('.relation')].map(r=>{const ref=parseRef(r.querySelector('.rel-name').value);if(!ref.name&&!ref.itemId)return null;const obj={itemId:ref.itemId,name:ref.name};if(withQty)obj.quantity=Math.max(0,Number(r.querySelector('.rel-qty').value||1));return obj}).filter(Boolean)}
function saveEditor(e){e.preventDefault();if(!editingId)return;const b=baseMap.get(editingId);const materials=collectRelations(els.materials,true),machines=collectRelations(els.machines,false);state.obtained[editingId]=$('#fObtained').value==='1';
 state.overrides[editingId]={name:$('#fName').value.trim(),category:$('#fCategory').value.trim(),researchStatus:$('#fResearch').value==='未特定'&&($('#fName').value.trim()!==b.name||$('#fCategory').value.trim()!==b.category)?'手入力':$('#fResearch').value,acquire:$('#fAcquire').value.trim(),sell:$('#fSell').value.trim(),source:b.source||'',note:markManual($('#fNote').value.trim()),materials,machines,updatedAt:new Date().toISOString()};
 saveState();refreshDatalists();els.editor.close();render();showToast('保存したよ ✓')}
function markManual(note){return note.includes('手入力')?note:(note?note+' / 手入力':'手入力')}
function resetItem(){if(!editingId)return;if(!confirm('このアイテムに加えた編集・レシピ情報を元に戻す？\n取得状態はそのまま残すよ。'))return;delete state.overrides[editingId];saveState();els.editor.close();render();showToast('編集内容を元に戻したよ')}

function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJson(){const payload={app:'ほの暮らしコンプチェッカー',version:VERSION,exportedAt:new Date().toISOString(),obtained:state.obtained,overrides:state.overrides};download(`honogurashi-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(payload,null,2),'application/json')}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){const heads=['図鑑番号','アイテム名','カテゴリ','調査状況','入手方法・補足','売値','出典URL','備考','取得状況','使用材料','対応加工機','最終更新'];const lines=[heads.join(',')];for(const b of base){const x=merged(b.id);const mats=(x.materials||[]).map(r=>`${refDisplay(r)} ×${r.quantity??1}`).join(' / ');const mach=(x.machines||[]).map(refDisplay).join(' / ');lines.push([x.id,x.name,x.category,x.researchStatus,x.acquire,x.sell,x.source,x.note,isObtained(x.id)?'取得済':'未取得',mats,mach,x.updatedAt].map(csvCell).join(','))}download(`honogurashi-items-${new Date().toISOString().slice(0,10)}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function importJson(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||typeof d!=='object'||!d.obtained||!d.overrides)throw new Error();if(!confirm('現在の保存データを、このバックアップ内容で置き換える？'))return;state={version:VERSION,obtained:d.obtained,overrides:d.overrides};saveState();refreshDatalists();render();showToast('バックアップを復元したよ ✓')}catch(e){alert('このJSONは読み込めなかったよ。バックアップファイルを確認してね。')}};fr.readAsText(file)}

els.items.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit){e.stopPropagation();openEditor(Number(edit.dataset.edit));return}const tog=e.target.closest('[data-toggle]');if(tog){e.stopPropagation();toggle(Number(tog.dataset.toggle));return}const row=e.target.closest('.item');if(row)toggle(Number(row.dataset.id))});
['input','change'].forEach(ev=>els.search.addEventListener(ev,render));els.category.addEventListener('change',render);els.sort.addEventListener('change',render);
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;$$('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#closeEditor').addEventListener('click',()=>els.editor.close());$('#cancelEditor').addEventListener('click',()=>els.editor.close());els.editor.addEventListener('click',e=>{if(e.target===els.editor)els.editor.close()});els.form.addEventListener('submit',saveEditor);$('#addMaterial').addEventListener('click',()=>addMaterialRow());$('#addMachine').addEventListener('click',()=>addMachineRow());$('#resetItem').addEventListener('click',resetItem);$('#exportJson').addEventListener('click',exportJson);$('#exportCsv').addEventListener('click',exportCsv);$('#importJson').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importJson(f);e.target.value=''});

async function init(){const fresh=await loadLatestMaster();buildLists();render();if(fresh)showToast('最新のアイテム情報を読み込んだよ ✓')}
init();
})();
</script>
</body>
</html>
